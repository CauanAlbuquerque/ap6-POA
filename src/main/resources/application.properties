spring.application.name=CineFlix

# ---- Banco de dados H2 (arquivo local, persiste entre execucoes) ----
spring.datasource.url=jdbc:h2:file:./data/cineflix
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ---- Executa scripts SQL sempre na inicializacao ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ---- Console web do H2 (para inspecionar o banco em /h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Servidor ----
server.port=8080
