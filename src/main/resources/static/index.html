<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ===== Navbar ===== -->
    <header class="navbar" id="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">CINE<span>FLIX</span></a>
            <nav class="nav-links">
                <a href="#" data-genre="" class="nav-link active">Inicio</a>
                <a href="#" data-genre="Acao" class="nav-link">Acao</a>
                <a href="#" data-genre="Comedia" class="nav-link">Comedia</a>
                <a href="#" data-genre="Romance" class="nav-link">Romance</a>
                <a href="#" data-genre="Ficcao Cientifica" class="nav-link">Ficcao</a>
                <a href="#" data-genre="Terror" class="nav-link">Terror</a>
            </nav>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar filmes...">
            </div>
            <a href="minha-lista.html" class="nav-rentals">Meus Alugueis</a>
            <div class="profile">
                <span id="user-name">Usuario</span>
                <button id="logout-btn" class="btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <!-- ===== Banner destaque ===== -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <h1 id="hero-title"></h1>
            <p id="hero-desc"></p>
            <div class="hero-buttons">
                <button class="btn-play" id="hero-play">Assistir</button>
                <button class="btn-info" id="hero-info">Mais informacoes</button>
            </div>
        </div>
        <div class="hero-fade"></div>
    </section>

    <!-- ===== Trilhos de filmes ===== -->
    <main class="rows" id="rows">
        <!-- Preenchido via JS -->
    </main>

    <!-- ===== Modal de detalhes / aluguel ===== -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-backdrop" id="modal-backdrop">
                <video id="modal-video" class="modal-video hidden" controls></video>
            </div>
            <div class="modal-body">
                <h2 id="modal-title"></h2>
                <div class="modal-meta">
                    <span id="modal-year"></span>
                    <span id="modal-duration"></span>
                    <span class="badge" id="modal-rating"></span>
                    <span id="modal-genre"></span>
                </div>
                <p id="modal-desc"></p>
                <div class="modal-rental">
                    <span class="price" id="modal-price"></span>
                    <span class="rental-info" id="modal-rental-info"></span>
                </div>
                <div class="modal-actions" id="modal-actions">
                    <!-- Botao de alugar ou assistir, preenchido via JS -->
                </div>
                <p class="modal-status hidden" id="modal-status"></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
